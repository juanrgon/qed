name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # SAT tests skip here (no CaDiCaL); they run on the laptop.
      - name: Vet and test
        run: go vet ./... && go test ./...
      # No human review: the ratchet is the gate. The previous commit's
      # checker tests must pass against the new checkers, and every claim
      # is graded by the previous commit's checkers. Checkers can get
      # stricter, never weaker.
      - name: Ratchet
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=origin/${{ github.base_ref }}
          else
            base=${{ github.event.before }}
          fi
          scripts/ratchet.sh "$base"
